name: Build Desktop Apps (macOS + Windows)

# Builds Wavie Fresh as a native desktop app with Tauri v2.
#  - Every push to main / manual run: builds installers and attaches them to the run as downloadable artifacts.
#  - Pushing a tag like v2.5.0: also creates a draft GitHub Release with the installers attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            artifact: Wavie-Fresh-macOS-AppleSilicon
          - name: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
            artifact: Wavie-Fresh-macOS-Intel
          - name: Windows
            platform: windows-latest
            args: ''
            rust_targets: ''
            artifact: Wavie-Fresh-Windows

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm install

      # macOS signing. With the Apple secrets set (see README → "macOS code signing"),
      # the app is signed with your Developer ID and notarized, so it opens on any Mac
      # with no warning. Without them it is ad-hoc signed, which still needs
      # System Settings → Privacy & Security → "Open Anyway" on first launch.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Only export variables that are actually set, so Tauri never sees empty values.
          put_env() {
            local delim
            delim="EOF_$(openssl rand -hex 8)"
            { echo "$1<<$delim"; printf '%s\n' "$2"; echo "$delim"; } >> "$GITHUB_ENV"
          }
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            put_env APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
            put_env APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
            put_env APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
            echo "Signing with your Developer ID certificate."
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              put_env APPLE_ID "$APPLE_ID"
              put_env APPLE_PASSWORD "$APPLE_PASSWORD"
              put_env APPLE_TEAM_ID "$APPLE_TEAM_ID"
              echo "Notarization enabled."
            else
              echo "::warning::APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID not set: the app will be signed but NOT notarized, so other Macs will still warn on first launch."
            fi
          else
            put_env APPLE_SIGNING_IDENTITY "-"
            echo "::warning::Apple signing secrets not set: building an ad-hoc signed app. Other Macs must use System Settings → Privacy & Security → Open Anyway on first launch. See README → macOS code signing."
          fi

      - name: Build app (and draft release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Wavie Fresh ${{ github.ref_name }}'
          releaseBody: 'Download the installer for your computer below: .dmg for macOS, -setup.exe or .msi for Windows.'
          releaseDraft: true
          prerelease: false

      - name: Report macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for app in src-tauri/target/*/release/bundle/macos/*.app; do
            echo "== $app"
            codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Identifier=|Authority=|Signature=|TeamIdentifier=' || true
            codesign --verify --deep --strict "$app" && echo "codesign verify: OK" || echo "::warning::codesign verify failed for $app"
            spctl -a -vv "$app" 2>&1 || true
          done

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
